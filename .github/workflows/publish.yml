name: Stage release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: stage-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  stage:
    needs: quality
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing and staged publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "clines@$VER" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already published
        if: steps.meta.outputs.published == 'true'
        run: |
          echo "clines@${{ steps.meta.outputs.version }} is already live on npm — nothing to stage."
          echo "Bump the version in package.json (via a PR) to stage a new release."

      - name: Build
        if: steps.meta.outputs.published == 'false'
        run: npm run build

      - name: Stage publish
        if: steps.meta.outputs.published == 'false'
        run: npm stage publish --tag latest

      - name: Deploy instructions
        if: steps.meta.outputs.published == 'false'
        run: |
          VER="${{ steps.meta.outputs.version }}"
          {
            echo "## Staged \`clines@${VER}\` for the \`latest\` tag"
            echo ""
            echo "It is in npm's **staging queue** and is **not yet public**."
            echo ""
            echo "### 1. Test the exact staged artifact"
            echo '```sh'
            echo "npm stage list clines            # find the <stage-id>"
            echo "npm stage download <stage-id>    # downloads clines-${VER}.tgz"
            echo "mkdir /tmp/try && cd /tmp/try && npm init -y"
            echo "npm i /path/to/clines-${VER}.tgz # install & run it"
            echo "npx clines scan ."
            echo '```'
            echo ""
            echo "### 2. Deploy (manual — requires your 2FA)"
            echo "- On **npmjs.com** → clines → Staged versions → **Approve** (enter your OTP), or"
            echo '```sh'
            echo "npm run deploy -- <stage-id>     # = npm stage approve <stage-id>"
            echo '```'
            echo ""
            echo "To discard instead: \`npm stage reject <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
