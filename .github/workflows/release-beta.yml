name: Release beta

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  publish-beta:
    name: Publish beta to npm
    needs: quality
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Compute beta version
        id: version
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          VER="${BASE}-beta.${{ github.run_number }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          npm version "$VER" --no-git-tag-version
          echo "Publishing beta version $VER"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish health check
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          for i in 1 2 3 4 5; do
            if npm install "clines@$VER"; then break; fi
            echo "Install attempt $i failed; retrying in 15s..."; sleep 15
          done
          npx clines --version
          printf 'const a = 1;\n' > sample.ts
          npx clines scan . --json --no-readme
          echo "Beta $VER healthy."
