name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  deploy:
    name: Publish latest to npm
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and guard against duplicates
        id: version
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "clines@$VER" version >/dev/null 2>&1; then
            echo "::error::clines@$VER is already published. Bump the version in package.json via a PR before deploying."
            exit 1
          fi
          echo "Deploying clines@$VER to latest."

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          git tag "v$VER"
          git push origin "v$VER"
          gh release create "v$VER" --title "v$VER" --generate-notes

      - name: Post-publish health check
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          for i in 1 2 3 4 5; do
            if npm install "clines@$VER"; then break; fi
            echo "Install attempt $i failed; retrying in 15s..."; sleep 15
          done
          npx clines --version
          printf 'const a = 1;\n' > sample.ts
          npx clines scan . --json --no-readme
          echo "Production $VER healthy."
