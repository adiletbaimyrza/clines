name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # clines reads git history; a depth-1 checkout makes refactor and
          # comments silently wrong, and its own diff mode unusable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage
        run: npm run coverage

      - name: Upload coverage report
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Health check
        run: |
          set -euo pipefail
          node dist/cli/index.js --version
          node dist/cli/index.js | grep -q "clines"
          TMP="$(mktemp -d)"
          printf 'const a = 1;\n// note\n' > "$TMP/sample.ts"
          OUT="$(node dist/cli/index.js count "$TMP")"
          echo "$OUT"
          echo "$OUT" | grep -q "Total"
          rm -rf "$TMP"

      - name: MCP handshake
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | node dist/cli/index.js mcp \
            | grep -q '"serverInfo"'

      - name: Measure ourselves
        run: |
          set -euo pipefail
          node dist/cli/index.js ctx --json --no-pager | node -e 'process.stdin.once("data", (d) => JSON.parse(d))'
          node dist/cli/index.js ctx --max 200k --no-pager
          node dist/cli/index.js dup --max-duplication 10 --no-pager
          # --min-lines keeps a 20-line file with two branches from tripping the gate
          node dist/cli/index.js cx --max-density 30 --min-lines 30 --no-pager
          node dist/cli/index.js coupling --no-pager
          node dist/cli/index.js agent --no-pager
